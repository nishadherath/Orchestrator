# Wait for this project-local MCP server to finish initializing before Codex
# builds its tool catalog. GRAFT can take longer than the default optional
# startup grace period when Node is cold.
mcp_optional_startup_grace_ms = 0

[mcp_servers.graft]
command = "C:/nvm4w/nodejs/node.exe"
args = [
  "C:/nvm4w/nodejs/node_modules/@nanonets/graft/dist/cli.js",
  "mcp",
  "C:/Users/Bob/Desktop/Code/Claude/Orchestrator",
]
cwd = "C:/Users/Bob/Desktop/Code/Claude/Orchestrator"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 60
